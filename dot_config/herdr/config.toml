onboarding = false

[ui]
agent_panel_sort = "spaces"

[keys]
prefix = "ctrl+b"           # Default prefix, just like tmux
new_tab = "prefix+c"        # Create new window/tab
next_tab = "prefix+n"       # Go to next tab
previous_tab = "prefix+p"   # Go to previous tab
focus_pane_left = "prefix+h" # Focus left pane
focus_pane_down = "prefix+j" # Focus down pane
focus_pane_up = "prefix+k"  # Focus up pane
focus_pane_right = "prefix+l" # Focus right pane
split_horizontal = "prefix+\"" # Standard tmux vertical split (splitting screen left/right)
split_vertical = "prefix+%"  # Standard tmux horizontal split (splitting screen top/bottom)
detach = "prefix+d"         # tmux detach habit (overrides Herdr's default 'q')


[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "$title"],
  ["agent", "$limit"],
  ["$context"],
]

# --- added by Agent Usage (usagebar) setup ---
[ui.toast]
delivery = "herdr" # or "system" / "terminal"

[ui.toast.herdr]
position = "bottom-left"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "prefix+b"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"
