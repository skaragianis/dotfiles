set -g mouse on
set -g renumber-windows off

# Number windows and panes from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g status-position top
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="echo '#{pane_current_command}' | grep -iqE '(nvim|vim)'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" -eq 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" -eq 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R


# Split with | (side by side) and - (stacked), keeping the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Swap the current pane with its neighbour (Ctrl+hjkl moves focus); focus
# follows the moved pane, and nothing happens at the window edge instead of
# wrapping round. Replaces the default prefix + L (switch to last session).
bind K if -F '#{pane_at_top}'    '' 'swap-pane -d -t "{up-of}"'
bind J if -F '#{pane_at_bottom}' '' 'swap-pane -d -t "{down-of}"'
bind H if -F '#{pane_at_left}'   '' 'swap-pane -d -t "{left-of}"'
bind L if -F '#{pane_at_right}'  '' 'swap-pane -d -t "{right-of}"'

# Toggle typing into every pane of the window at once. Set per pane so the
# agent sidebar (@pane_role sidebar) is left out and doesn't take keystrokes.
bind a run-shell ' \
  v=on; [ "#{synchronize-panes}" = 1 ] && v=off; \
  tmux list-panes -t "#{window_id}" -F "##{pane_id} ##{@pane_role}" | \
  while read -r id role; do \
    if [ "$role" = sidebar ]; then tmux set -p -t "$id" synchronize-panes off; \
    else tmux set -p -t "$id" synchronize-panes "$v"; fi; \
  done; \
  tmux display "synchronize panes: $v"'

# True color
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Extended keys, so modified keys like Shift+Enter and Ctrl+Enter reach apps
# that ask for them instead of collapsing to their plain versions.
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# Status bar
set -g status-justify left
set -g status-bg "#181825"
set -g status-fg "#cdd6f4"

# Left: session name
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold]   #S #[bg=default,fg=default] "
set -g status-left-length 30

# Window tabs: active is green, inactive is muted
setw -g window-status-current-format "#[fg=#11111b,bg=#a6e3a1,bold]  #I:#W #[bg=default,fg=default]"
setw -g window-status-format "#[fg=#6c7086,bg=#313244]  #I:#W "

# Right: sessions (current one highlighted), then the time. Click a session
# to switch to it; clicks elsewhere keep tmux's default of selecting the
# clicked window.
set -g status-right-length 100
set -g status-right '#{S:#[range=session|#{session_id}] #{session_name} #[norange],#[range=session|#{session_id}]#[reverse] #{session_name} #[noreverse]#[norange]}#[fg=#6c7086]   %H:%M '
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},session}' 'switch-client -t =' 'select-window -t ='

# Pane borders
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#89b4fa"

# Plugins (TPM). Install new ones with prefix + I.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'hiroppy/tmux-agent-sidebar'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Continuum autosaves by hooking into status-right, so it must stay the last
# plugin: anything after it that rewrites status-right stops the autosave.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Keep this last. TPM is cloned to ~/.tmux/plugins/tpm on the Debian VM and
# comes from Homebrew on the Mac; machines with neither still load cleanly.
if-shell "test -x ~/.tmux/plugins/tpm/tpm" "run ~/.tmux/plugins/tpm/tpm" \
  "if-shell 'test -x /opt/homebrew/opt/tpm/share/tpm/tpm' 'run /opt/homebrew/opt/tpm/share/tpm/tpm'"
